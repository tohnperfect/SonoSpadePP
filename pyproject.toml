[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sonospadepp"
version = "1.0.0"
description = "SonoSpadePP: patient-faithful, real-time ultrasound synthesis from CT on top of SonoSPADE, at three levels of supervision (unpaired, paired planes of other patients, one image of the patient)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    # SonoSPADE v0.2.0 provides the usbg package (physics render, volumes, the v1 translator and metrics)
    "sonospade @ git+https://github.com/tohnperfect/SonoSpade@v0.2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.2",
    "torchvision>=0.17",
    "nibabel>=5.0",
    "pillow>=9.0",
    "pyyaml>=6.0",
    "timm>=1.0",          # DINOv2 and the USFM encoder (sonospadepp.v2.features)
    "monai>=1.3",         # the EchoCare encoder (sonospadepp.v2.features)
    "lpips>=0.1.4",       # diversity metric (sonospadepp.v2.diversity)
]

[project.optional-dependencies]
viz = ["matplotlib>=3.6"]                       # figure scripts and training previews
onnx = ["onnx>=1.15", "onnxruntime>=1.17"]      # CPU frame-rate benchmark (scripts/v2/bench_endtoend.py)
dev = ["pytest>=8.0"]
all = ["matplotlib>=3.6", "onnx>=1.15", "onnxruntime>=1.17", "pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
